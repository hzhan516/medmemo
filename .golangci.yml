run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
    - gocritic
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert

linters-settings:
  depguard:
    rules:
      # DEP-001: domain 包只能导入标准库、其他 domain 包和 pkg/models
      domain_zero_deps:
        files:
          - "**/internal/domain/**/*.go"
          - "!**/internal/domain/**/*_test.go"
        deny:
          - pkg: "github.com/hzhan516/medmemo/internal/adapters/**/*"
            desc: "domain layer must not depend on adapters"
          - pkg: "github.com/hzhan516/medmemo/internal/application/**/*"
            desc: "domain layer must not depend on application"
          - pkg: "github.com/hzhan516/medmemo/internal/infrastructure/**/*"
            desc: "domain layer must not depend on infrastructure"
          - pkg: "github.com/hzhan516/medmemo/pkg/desensitizer"
            desc: "domain layer must not depend on pkg/desensitizer"

      # DEP-002: application 层不能直接调用 adapter/infrastructure 实现
      app_no_adapter:
        files:
          - "**/internal/application/**/*.go"
          - "!**/internal/application/**/*_test.go"
        deny:
          - pkg: "github.com/hzhan516/medmemo/internal/adapters/**/*"
            desc: "application layer must not depend on adapter implementations"
          - pkg: "github.com/hzhan516/medmemo/internal/infrastructure/**/*"
            desc: "application layer must not depend on infrastructure"

      # DEP-003: adapter 层不能反向依赖 cmd
      adapter_no_cmd:
        files:
          - "**/internal/adapters/**/*.go"
          - "!**/internal/adapters/**/*_test.go"
        deny:
          - pkg: "github.com/hzhan516/medmemo/cmd/**/*"
            desc: "adapter layer must not depend on cmd package"

      # DEP-005: infrastructure 层不知道业务存在
      infra_no_business:
        files:
          - "**/internal/infrastructure/**/*.go"
          - "!**/internal/infrastructure/**/*_test.go"
        deny:
          - pkg: "github.com/hzhan516/medmemo/internal/domain/**/*"
            desc: "infrastructure layer must not depend on domain"
          - pkg: "github.com/hzhan516/medmemo/internal/application/**/*"
            desc: "infrastructure layer must not depend on application"
          - pkg: "github.com/hzhan516/medmemo/internal/adapters/**/*"
            desc: "infrastructure layer must not depend on adapters"

  revive:
    rules:
      - name: exported
        arguments:
          - "sayRepetitiveInsteadOfStutters"
      - name: var-naming
      - name: indent-error-flow

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # 测试文件中 defer Close 不检查错误是常见做法
    - path: _test\.go$
      linters:
        - errcheck
    # defer Close 的错误返回值在清理路径中通常无需处理，项目中有大量 pre-existing 模式
    - text: "Error return value of `.*Close` is not checked"
      linters:
        - errcheck
    # revive exported 规则要求所有导出符号添加注释，项目当前有大量 pre-existing 缺失
    # 后续通过独立 PR 逐步补齐文档注释
    - linters:
        - revive
      text: "exported"
