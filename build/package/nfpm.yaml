name: medmemo
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: MedMemo Contributors <hello@medmemo.dev>
description: Local-first desktop health information assistant. Not a medical device.
license: MIT
homepage: https://github.com/hzhan516/medmemo
contents:
  - src: build/bin/MedMemo
    dst: /opt/medmemo/MedMemo
    file_info:
      mode: 0755
  - src: resources
    dst: /opt/medmemo/resources
  - src: build/package/linux/medmemo
    dst: /usr/bin/medmemo
    file_info:
      mode: 0755
  - src: build/package/linux/medmemo.desktop
    dst: /usr/share/applications/medmemo.desktop
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/medmemo.png
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
  - libsoup-3.0-0
overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libsoup3
