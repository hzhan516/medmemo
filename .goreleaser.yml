version: 2
project_name: MedMemo

# 前端构建与四平台产物已在 CI 中完成；这里只负责把 staging 后的六资产 + checksums 发布为 Draft。
before:
  hooks: []

builds:
  - skip: true

checksum:
  name_template: 'checksums.txt'
  extra_files:
    # 单一事实源：scripts/build/release-assets-manifest.json
    - glob: release-assets/*

release:
  # 正式发布采用 Draft 两阶段；prerelease 由 release.yml / finalize-release.yml 按 tag 类型调整。
  draft: true
  prerelease: false
  name_template: "MedMemo {{ .Version }}"
  extra_files:
    # 单一事实源：scripts/build/release-assets-manifest.json
    - glob: release-assets/*

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
