version: 2
project_name: MedMemo

before:
  hooks:
    - bash -c 'cd web && npm ci && npm run build'

builds:
  - skip: true

checksum:
  name_template: 'checksums.txt'

release:
  # 与 build-and-release.yml 的 softprops 发布保持一致：正式版直接发布（非草稿），
  # 预发布由 tag 后缀（-rc）经 prerelease: auto 自动判定。
  draft: false
  prerelease: auto
  mode: append
  name_template: "MedMemo {{ .Version }}"
  extra_files:
    - glob: build/bin/*.AppImage
    - glob: build/bin/*.deb
    - glob: build/bin/*.rpm
    - glob: build/bin/*.dmg
    - glob: build/bin/*-installer.exe

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
