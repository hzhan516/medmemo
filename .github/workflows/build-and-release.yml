name: Build and Release

on:
  push:
    branches: [main, develop]

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

permissions:
  contents: write

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.info.productVersion' wails.json)
          RUN_NUMBER=${{ github.run_number }}
          BRANCH=${{ github.ref_name }}

          if [ "$BRANCH" = "main" ]; then
            VERSION="${BASE_VERSION}-build.${RUN_NUMBER}"
            PRERELEASE="false"
          else
            VERSION="${BASE_VERSION}-Pre-release-build.${RUN_NUMBER}"
            PRERELEASE="true"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION (prerelease=$PRERELEASE)"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev gcc

      - name: Install macOS dependencies
        if: matrix.platform == 'darwin'
        run: brew install sqlcipher create-dmg

      - name: Build and Package
        run: ./scripts/build/wails-build.sh ${{ matrix.platform }} ${{ needs.version.outputs.version }}
        shell: bash

      - name: Check binary size (Linux)
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medmemo-${{ matrix.platform }}-${{ needs.version.outputs.version }}
          path: build/bin/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-linux-${{ needs.version.outputs.version }}
          path: artifacts/linux/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-windows-${{ needs.version.outputs.version }}
          path: artifacts/windows/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-${{ needs.version.outputs.version }}
          path: artifacts/darwin/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Windows：优先 NSIS installer，回退到裸二进制
          if [ -f "artifacts/windows/MedMemo-amd64-installer.exe" ]; then
              cp "artifacts/windows/MedMemo-amd64-installer.exe" "release-assets/MedMemoSetup.exe"
          elif [ -f "artifacts/windows/MedMemo.exe" ]; then
              cp "artifacts/windows/MedMemo.exe" "release-assets/MedMemoSetup.exe"
          fi

          # macOS：只发布 .dmg
          if [ -f "artifacts/darwin/MedMemo.dmg" ]; then
              cp "artifacts/darwin/MedMemo.dmg" "release-assets/MedMemo.dmg"
          fi

          # Linux：只发布 .AppImage
          if [ -f "artifacts/linux/MedMemo-x86_64.AppImage" ]; then
              cp "artifacts/linux/MedMemo-x86_64.AppImage" "release-assets/MedMemo.AppImage"
          fi

          # 生成 checksums.txt 供 updater 校验使用
          if [ "$(ls -A release-assets)" ]; then
              cd release-assets
              sha256sum * > checksums.txt
              cd ..
          fi

          echo "Release assets:"
          ls -la release-assets/

      # 先以 draft 创建 release 并上传资产，避免 immutable release 仓库
      # 在 prerelease 状态下拒绝后续资产上传的问题。
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          name: MedMemo ${{ needs.version.outputs.version }}
          tag_name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          draft: true
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        run: gh release edit "${{ needs.version.outputs.version }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
