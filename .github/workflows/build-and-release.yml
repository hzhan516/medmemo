name: Build and Release

on:
  push:
    branches: [main, 'release/**']

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

permissions:
  contents: write

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      current_version: ${{ steps.version.outputs.current_version }}
      display_version: ${{ steps.version.outputs.display_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_number: ${{ steps.version.outputs.build_number }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      prerelease_label: ${{ steps.version.outputs.prerelease_label }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.info.productVersion' wails.json)
          RUN_NUMBER=${{ github.run_number }}
          BRANCH=${{ github.ref_name }}

          if [ "$BRANCH" = "main" ]; then
            CURRENT_VERSION="v${BASE_VERSION}"
            DISPLAY_VERSION="v${BASE_VERSION}"
            RELEASE_TAG="v${BASE_VERSION}"
            BUILD_NUMBER=""
            CHANNEL="stable"
            PRERELEASE="false"
            PRERELEASE_LABEL=""
          else
            CURRENT_VERSION="v${BASE_VERSION}-Pre-release-build.${RUN_NUMBER}"
            DISPLAY_VERSION="v${BASE_VERSION}-Pre-release-build.${RUN_NUMBER}"
            RELEASE_TAG="v${BASE_VERSION}-Pre-release-build.${RUN_NUMBER}"
            BUILD_NUMBER="${RUN_NUMBER}"
            CHANNEL="beta"
            PRERELEASE="true"
            PRERELEASE_LABEL="Pre-release"
          fi

          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "prerelease_label=$PRERELEASE_LABEL" >> $GITHUB_OUTPUT
          echo "Generated: base=$BASE_VERSION current=$CURRENT_VERSION tag=$RELEASE_TAG channel=$CHANNEL prerelease=$PRERELEASE"

      - name: Check duplicate release tag (main only)
        if: github.ref_name == 'main'
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "ERROR: Release tag $TAG already exists."
            echo "Bump wails.json info.productVersion before pushing to main."
            exit 1
          fi
          echo "Release tag $TAG is available."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev gcc

      - name: Install macOS dependencies
        if: matrix.platform == 'darwin'
        run: brew install sqlcipher create-dmg

      - name: Install dlfcn-win32 for ortgenai (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn

      - name: Build and Package
        run: |
          ./scripts/build/wails-build.sh \
            "${{ matrix.platform }}" \
            "${{ needs.version.outputs.current_version }}" \
            "${{ needs.version.outputs.build_number }}" \
            "${{ needs.version.outputs.channel }}" \
            "${{ needs.version.outputs.prerelease_label }}"
        shell: bash

      - name: Check binary size (Linux)
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Verify release artifact
        run: ./scripts/build/verify-release-artifact.sh ${{ matrix.platform }}
        shell: bash

      - name: Linux runtime smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export HOME="$RUNNER_TEMP/medmemo-home"
          export MEDMEMO_DATA_DIR="$RUNNER_TEMP/medmemo-data"
          mkdir -p "$HOME" "$MEDMEMO_DATA_DIR"

          # 后台启动二进制，检查进程存活至少 5 秒
          xvfb-run -a timeout 20s ./build/bin/MedMemo &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "ERROR: MedMemo binary crashed or exited early"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Smoke test passed: binary stays alive for 5s"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medmemo-${{ matrix.platform }}-${{ needs.version.outputs.release_tag }}
          path: build/bin/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: medmemo-linux-${{ needs.version.outputs.release_tag }}
          path: artifacts/linux/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: medmemo-windows-${{ needs.version.outputs.release_tag }}
          path: artifacts/windows/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: medmemo-darwin-${{ needs.version.outputs.release_tag }}
          path: artifacts/darwin/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Windows：优先 NSIS installer，回退到裸二进制
          if [ -f "artifacts/windows/MedMemo-amd64-installer.exe" ]; then
              cp "artifacts/windows/MedMemo-amd64-installer.exe" "release-assets/MedMemoSetup.exe"
          elif [ -f "artifacts/windows/MedMemo.exe" ]; then
              cp "artifacts/windows/MedMemo.exe" "release-assets/MedMemoSetup.exe"
          fi

          # macOS：只发布 .dmg
          if [ -f "artifacts/darwin/MedMemo.dmg" ]; then
              cp "artifacts/darwin/MedMemo.dmg" "release-assets/MedMemo.dmg"
          fi

          # Linux：只发布 .AppImage，保留架构后缀以便 updater 优先匹配
          if [ -f "artifacts/linux/MedMemo-x86_64.AppImage" ]; then
              cp "artifacts/linux/MedMemo-x86_64.AppImage" "release-assets/MedMemo-x86_64.AppImage"
          fi

          # 生成 checksums.txt 供 updater 校验使用
          if [ "$(ls -A release-assets)" ]; then
              cd release-assets
              sha256sum * > checksums.txt
              cd ..
          fi

          echo "Release assets:"
          ls -la release-assets/

      # 先以 draft 创建 release 并上传资产，避免 immutable release 仓库
      # 在 prerelease 状态下拒绝后续资产上传的问题。
      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          name: MedMemo ${{ needs.version.outputs.display_version }}
          tag_name: ${{ needs.version.outputs.release_tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          draft: true
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        run: |
          TAG="${{ needs.version.outputs.release_tag }}"
          REPO="${{ github.repository }}"
          MAX_RETRIES=5
          DELAY=10

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: Publishing release $TAG..."

            # 幂等检查：若已被发布则直接成功
            # stderr 保留到日志用于排查，通过 set +e 捕获退出码避免吞掉认证失败等真实错误
            set +e
            DRAFT_JSON=$(gh release view "$TAG" --repo "$REPO" --json isDraft 2>/tmp/gh_view_err)
            VIEW_EXIT=$?
            set -e

            if [ $VIEW_EXIT -eq 0 ]; then
              DRAFT_STATUS=$(echo "$DRAFT_JSON" | jq -r '.isDraft')
              if [ "$DRAFT_STATUS" = "false" ]; then
                echo "Release $TAG is already published."
                exit 0
              fi
            else
              echo "gh release view exited with code $VIEW_EXIT, stderr:"
              cat /tmp/gh_view_err
            fi

            if gh release edit "$TAG" --draft=false --repo "$REPO"; then
              echo "Release published successfully."
              exit 0
            fi

            if [ $i -lt $MAX_RETRIES ]; then
              echo "Waiting ${DELAY}s before retry..."
              sleep $DELAY
              DELAY=$((DELAY * 2))
            fi
          done

          echo "Failed to publish release after $MAX_RETRIES attempts."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
