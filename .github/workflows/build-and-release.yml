name: Build and Release

on:
  push:
    branches: ['release/**']

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

permissions:
  contents: write

concurrency:
  group: rc-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rc-unit-test:
    name: RC Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Download native libraries for unit tests
        run: |
          ./scripts/build/download-onnx.sh --platform=linux
          ./scripts/build/download-tokenizers.sh --platform=linux

      - name: Run unit tests
        run: make test

      - name: Generate HTML coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out -o coverage-summary.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rc-coverage-report
          path: |
            ./coverage.out
            ./coverage.html
            ./coverage-summary.txt
          retention-days: 7

  licenses-check:
    name: License Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Download Go modules
        run: go mod download all

      - name: Generate licenses
        run: make licenses

      - name: Verify no license drift
        run: git diff --exit-code THIRD_PARTY_LICENSES.md

  version:
    name: Generate Version
    needs: [rc-unit-test, licenses-check]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.info.productVersion' wails.json)
          REF="${GITHUB_REF_NAME}"

          if [[ "$REF" != release/* ]]; then
            echo "ERROR: Unsupported ref for RC workflow: $REF"
            exit 1
          fi

          BRANCH_VER=$(echo "$REF" | sed 's|release/v||')
          if [[ "$BRANCH_VER" != "$BASE_VERSION" ]]; then
            echo "ERROR: Branch version ($BRANCH_VER) != wails.json productVersion ($BASE_VERSION)"
            exit 1
          fi

          # 统一使用 vX.Y.Z-rc.N 作为预发布 tag，避免 -Pre-release 重名和无限叠加 build 号。
          # 从远程读取该版本已有的 rc tag 并取最大 build 号自增，避免 release/** 被重复合并时
          # 因本地（浅克隆）看不到 tag 而始终生成 rc.1、进而 push 已存在 tag 导致 CI 冲突失败。
          ESC_VERSION=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
          MAX_N=$(git ls-remote --tags origin "v${BASE_VERSION}-rc.*" \
            | awk '{print $2}' | sed 's|refs/tags/||; s|\^{}$||' \
            | grep -E "^v${ESC_VERSION}-rc\.[0-9]+$" \
            | sed 's/.*-rc\.//' | sort -n | tail -1)
          N=$(( ${MAX_N:-0} + 1 ))
          VERSION="v${BASE_VERSION}-rc.${N}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Create RC tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Created and pushed tag $VERSION."

  build:
    name: Build ${{ matrix.platform }}
    needs: [version, licenses-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: darwin-amd64
            arch: x86_64
          - os: macos-14
            platform: darwin-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev gcc

      - name: Install nfpm (Linux packaging)
        if: matrix.platform == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'darwin')
        run: brew install sqlcipher create-dmg

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn mingw-w64-x86_64-gcc-libs
          choco install nsis -y

      - name: Force static libdl (avoid libdl.dll runtime dependency)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          # ortgenai 自带 `#cgo LDFLAGS: -ldl` 与 `#include <dlfcn.h>`（无 build-tag 保护），
          # 因此编译必须提供 dlfcn.h 头文件与 libdl。dlfcn-win32 同时安装了共享导入库
          # (libdl.dll.a) 与静态库 (libdl.a)；若保留共享导入库，链接器会解析到 libdl.dll，
          # 最终 MedMemo.exe 会带上 libdl.dll 运行时依赖（Windows 上不存在，导致启动即失败）。
          # 删除共享导入库与 DLL，强制 `-ldl` 解析到静态归档，产物不再依赖 libdl.dll。
          ls -la /c/msys64/mingw64/lib/libdl* || true
          rm -f /c/msys64/mingw64/lib/libdl.dll.a /c/msys64/mingw64/bin/libdl.dll
          test -f /c/msys64/mingw64/lib/libdl.a && echo "static libdl.a present"

      - name: Build and Package
        run: ./scripts/build/wails-build.sh ${{ matrix.platform }} ${{ needs.version.outputs.version }}
        shell: bash

      - name: Check binary size (Linux)
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Verify release artifact
        run: ./scripts/build/verify-release-artifact.sh ${{ matrix.platform }} ${{ matrix.arch }}
        shell: bash

      - name: Linux runtime smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export HOME="$RUNNER_TEMP/medmemo-home"
          export MEDMEMO_DATA_DIR="$RUNNER_TEMP/medmemo-data"
          mkdir -p "$HOME" "$MEDMEMO_DATA_DIR"

          # 后台启动二进制，检查进程存活至少 5 秒
          xvfb-run -a timeout 20s ./build/bin/MedMemo &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "ERROR: MedMemo binary crashed or exited early"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Smoke test passed: binary stays alive for 5s"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medmemo-${{ matrix.platform }}-${{ needs.version.outputs.version }}
          path: build/bin/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-linux-${{ needs.version.outputs.version }}
          path: artifacts/linux/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-windows-${{ needs.version.outputs.version }}
          path: artifacts/windows/

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-amd64-${{ needs.version.outputs.version }}
          path: artifacts/darwin-amd64/

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-arm64-${{ needs.version.outputs.version }}
          path: artifacts/darwin-arm64/

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ./scripts/build/prepare-release-assets.sh "$VERSION" "release-assets" \
            "artifacts/linux" "artifacts/windows" \
            "artifacts/darwin-amd64" "artifacts/darwin-arm64"
          echo "Release assets:"
          ls -la release-assets/

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > checksums.txt
          cd ..
          echo "Generated checksums.txt:"
          cat release-assets/checksums.txt

      - name: Verify release asset whitelist
        run: ./scripts/build/verify-release-assets.sh release-assets "$VERSION"

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MedMemo ${{ needs.version.outputs.version }}
          tag_name: ${{ needs.version.outputs.version }}
          prerelease: true
          draft: true
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release as Pre-release
        run: gh release edit "${{ needs.version.outputs.version }}" --draft=false --prerelease=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
