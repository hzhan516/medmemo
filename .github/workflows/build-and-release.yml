name: Build and Release

on:
  push:
    branches: [main, 'release/**']

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

permissions:
  contents: write

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.info.productVersion' wails.json)
          REF="${GITHUB_REF_NAME}"

          if [[ "$REF" == release/* ]]; then
            BRANCH_VER=$(echo "$REF" | sed 's|release/v||')
            if [[ "$BRANCH_VER" != "$BASE_VERSION" ]]; then
              echo "ERROR: Branch version ($BRANCH_VER) != wails.json productVersion ($BASE_VERSION)"
              exit 1
            fi
            # 统一使用 vX.Y.Z-rc.N 作为预发布 tag，避免 -Pre-release 重名和无限叠加 build 号。
            # 从远程读取该版本已有的 rc tag 并取最大 build 号自增，避免 release/** 被重复合并时
            # 因本地（浅克隆）看不到 tag 而始终生成 rc.1、进而 push 已存在 tag 导致 CI 冲突失败。
            ESC_VERSION=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
            MAX_N=$(git ls-remote --tags origin "v${BASE_VERSION}-rc.*" \
              | awk '{print $2}' | sed 's|refs/tags/||; s|\^{}$||' \
              | grep -E "^v${ESC_VERSION}-rc\.[0-9]+$" \
              | sed 's/.*-rc\.//' | sort -n | tail -1)
            N=$(( ${MAX_N:-0} + 1 ))
            VERSION="v${BASE_VERSION}-rc.${N}"
            PRERELEASE="true"
            DRAFT="false"
          elif [[ "$REF" == "main" ]]; then
            VERSION="v${BASE_VERSION}"
            PRERELEASE="false"
            DRAFT="false"
          else
            echo "Unsupported ref: $REF"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "draft=$DRAFT" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION (prerelease=$PRERELEASE, draft=$DRAFT)"

      - name: Create or reuse tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, reusing it."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Created and pushed tag $VERSION."
          fi

      - name: Prune old release-candidate tags
        if: startsWith(github.ref_name, 'release/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION=$(jq -r '.info.productVersion' wails.json)
          ESC_VERSION=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
          KEEP=3
          # 列出该版本所有 rc tag，按 build 号升序（最旧在前）
          TAGS=$(git ls-remote --tags origin "v${BASE_VERSION}-rc.*" \
            | awk '{print $2}' | sed 's|refs/tags/||; s|\^{}$||' \
            | grep -E "^v${ESC_VERSION}-rc\.[0-9]+$" \
            | sort -t. -k4 -n | uniq)
          COUNT=$(printf '%s\n' "$TAGS" | grep -c . || true)
          echo "Found $COUNT rc tag(s) for v${BASE_VERSION}; keeping newest ${KEEP}."
          if [ "$COUNT" -gt "$KEEP" ]; then
            printf '%s\n' "$TAGS" | head -n "$((COUNT - KEEP))" | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "Pruning old rc tag and release: $tag"
              # 先删关联的 GitHub Release（含 tag）；无 release 时忽略错误，再兜底删除 tag
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
              git push origin ":refs/tags/$tag" 2>/dev/null || true
            done
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: darwin-amd64
            arch: x86_64
          - os: macos-14
            platform: darwin-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev gcc

      - name: Install nfpm (Linux packaging)
        if: matrix.platform == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'darwin')
        run: brew install sqlcipher create-dmg

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn mingw-w64-x86_64-gcc-libs
          choco install nsis -y

      - name: Build and Package
        run: ./scripts/build/wails-build.sh ${{ matrix.platform }} ${{ needs.version.outputs.version }}
        shell: bash

      - name: Check binary size (Linux)
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Verify release artifact
        run: ./scripts/build/verify-release-artifact.sh ${{ matrix.platform }} ${{ matrix.arch }}
        shell: bash

      - name: Linux runtime smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export HOME="$RUNNER_TEMP/medmemo-home"
          export MEDMEMO_DATA_DIR="$RUNNER_TEMP/medmemo-data"
          mkdir -p "$HOME" "$MEDMEMO_DATA_DIR"

          # 后台启动二进制，检查进程存活至少 5 秒
          xvfb-run -a timeout 20s ./build/bin/MedMemo &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "ERROR: MedMemo binary crashed or exited early"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Smoke test passed: binary stays alive for 5s"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medmemo-${{ matrix.platform }}-${{ needs.version.outputs.version }}
          path: build/bin/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-linux-${{ needs.version.outputs.version }}
          path: artifacts/linux/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-windows-${{ needs.version.outputs.version }}
          path: artifacts/windows/

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-amd64-${{ needs.version.outputs.version }}
          path: artifacts/darwin-amd64/

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-arm64-${{ needs.version.outputs.version }}
          path: artifacts/darwin-arm64/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          VERSION="${{ needs.version.outputs.version }}"

          # Windows: only ship the NSIS installer, never fall back to a bare exe.
          if [ -f "artifacts/windows/MedMemo-amd64-installer.exe" ]; then
              cp "artifacts/windows/MedMemo-amd64-installer.exe" "release-assets/MedMemoSetup.exe"
          else
              echo "ERROR: Windows installer not found"
              exit 1
          fi

          # macOS Intel
          if [ -f "artifacts/darwin-amd64/MedMemo_x86_64.dmg" ]; then
              cp "artifacts/darwin-amd64/MedMemo_x86_64.dmg" "release-assets/MedMemo_x86_64.dmg"
          else
              echo "ERROR: macOS Intel DMG missing"
              exit 1
          fi

          # macOS Apple Silicon
          if [ -f "artifacts/darwin-arm64/MedMemo_arm64.dmg" ]; then
              cp "artifacts/darwin-arm64/MedMemo_arm64.dmg" "release-assets/MedMemo_arm64.dmg"
          else
              echo "ERROR: macOS Apple Silicon DMG missing"
              exit 1
          fi

          # Linux: AppImage, DEB and RPM packages.
          if [ -f "artifacts/linux/MedMemo-x86_64.AppImage" ]; then
              cp "artifacts/linux/MedMemo-x86_64.AppImage" "release-assets/MedMemo-x86_64.AppImage"
          else
              echo "ERROR: Linux AppImage missing"
              exit 1
          fi

          DEB_FILE="artifacts/linux/MedMemo_${VERSION}_amd64.deb"
          if [ -f "$DEB_FILE" ]; then
              cp "$DEB_FILE" "release-assets/$(basename "$DEB_FILE")"
          else
              echo "ERROR: Linux DEB package missing: $DEB_FILE"
              exit 1
          fi

          RPM_FILE="artifacts/linux/MedMemo-${VERSION}-1.x86_64.rpm"
          if [ -f "$RPM_FILE" ]; then
              cp "$RPM_FILE" "release-assets/$(basename "$RPM_FILE")"
          else
              echo "ERROR: Linux RPM package missing: $RPM_FILE"
              exit 1
          fi

          echo "Release assets:"
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cd ..
          echo "Generated checksums.txt:"
          cat release-assets/checksums.txt

      - name: Verify release asset whitelist
        run: ./scripts/build/verify-release-assets.sh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MedMemo ${{ needs.version.outputs.version }}
          tag_name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          draft: true
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        run: gh release edit "${{ needs.version.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
