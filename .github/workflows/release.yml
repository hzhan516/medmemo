name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: darwin-amd64
            arch: x86_64
          - os: macos-14
            platform: darwin-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev gcc

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'darwin')
        run: |
          brew install sqlcipher create-dmg

      - name: Install dlfcn-win32 for ortgenai (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn

      - name: Build and Package
        run: ./scripts/build/wails-build.sh ${{ matrix.platform }} ${{ github.ref_name }}
        shell: bash

      - name: Check binary size
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Verify release artifact
        run: ./scripts/build/verify-release-artifact.sh ${{ matrix.platform }} ${{ matrix.arch }}
        shell: bash

      - name: Linux runtime smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export HOME="$RUNNER_TEMP/medmemo-home"
          export MEDMEMO_DATA_DIR="$RUNNER_TEMP/medmemo-data"
          mkdir -p "$HOME" "$MEDMEMO_DATA_DIR"

          # Start the binary in the background and ensure it stays alive for 5s.
          xvfb-run -a timeout 20s ./build/bin/MedMemo &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "ERROR: MedMemo binary crashed or exited early"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Smoke test passed: binary stays alive for 5s"
        shell: bash

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          VERSION="${{ github.ref_name }}"

          case "${{ matrix.platform }}" in
            windows)
              if [ -f "build/bin/MedMemo-amd64-installer.exe" ]; then
                cp "build/bin/MedMemo-amd64-installer.exe" "release-assets/MedMemoSetup.exe"
              else
                echo "ERROR: Windows installer not found"
                exit 1
              fi
              ;;
            darwin-amd64)
              if [ -f "build/bin/MedMemo_x86_64.dmg" ]; then
                cp "build/bin/MedMemo_x86_64.dmg" "release-assets/MedMemo_x86_64.dmg"
              else
                echo "ERROR: macOS Intel DMG missing"
                exit 1
              fi
              ;;
            darwin-arm64)
              if [ -f "build/bin/MedMemo_arm64.dmg" ]; then
                cp "build/bin/MedMemo_arm64.dmg" "release-assets/MedMemo_arm64.dmg"
              else
                echo "ERROR: macOS Apple Silicon DMG missing"
                exit 1
              fi
              ;;
            linux)
              if [ -f "build/bin/MedMemo-x86_64.AppImage" ]; then
                cp "build/bin/MedMemo-x86_64.AppImage" "release-assets/MedMemo-x86_64.AppImage"
              else
                echo "ERROR: Linux AppImage missing"
                exit 1
              fi
              DEB_FILE="build/bin/MedMemo_${VERSION}_amd64.deb"
              if [ -f "$DEB_FILE" ]; then
                cp "$DEB_FILE" "release-assets/$(basename "$DEB_FILE")"
              else
                echo "ERROR: Linux DEB package missing: $DEB_FILE"
                exit 1
              fi
              RPM_FILE="build/bin/MedMemo-${VERSION}-1.x86_64.rpm"
              if [ -f "$RPM_FILE" ]; then
                cp "$RPM_FILE" "release-assets/$(basename "$RPM_FILE")"
              else
                echo "ERROR: Linux RPM package missing: $RPM_FILE"
                exit 1
              fi
              ;;
          esac

          echo "Release assets:"
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cd ..
          echo "Generated checksums.txt:"
          cat release-assets/checksums.txt

      - name: Verify release asset whitelist
        run: ./scripts/build/verify-release-assets.sh release-assets

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
