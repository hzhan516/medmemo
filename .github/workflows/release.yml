name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev gcc

      - name: Install macOS dependencies
        if: matrix.platform == 'darwin'
        run: |
          brew install sqlcipher create-dmg

      - name: Install dlfcn-win32 for ortgenai (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn

      - name: Build and Package
        run: ./scripts/build/wails-build.sh ${{ matrix.platform }} ${{ github.ref_name }}
        shell: bash

      - name: Check binary size
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Verify release artifact
        run: ./scripts/build/verify-release-artifact.sh ${{ matrix.platform }}
        shell: bash

      - name: Linux runtime smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export HOME="$RUNNER_TEMP/medmemo-home"
          export MEDMEMO_DATA_DIR="$RUNNER_TEMP/medmemo-data"
          mkdir -p "$HOME" "$MEDMEMO_DATA_DIR"

          # 后台启动二进制，检查进程存活至少 5 秒
          xvfb-run -a timeout 20s ./build/bin/MedMemo &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "ERROR: MedMemo binary crashed or exited early"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Smoke test passed: binary stays alive for 5s"
        shell: bash

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
