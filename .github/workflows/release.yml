name: Release

on:
  push:
    tags:
      # 仅处理正式版本 tag 与 rehearsal tag；rc tag 与旧 Pre-release tag 由 build-and-release.yml 处理。
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v0.0.0-rehearsal.[0-9]+'

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

permissions:
  contents: write
  packages: write

concurrency:
  group: stable-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Tag Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PRODUCT_VERSION=$(jq -r '.info.productVersion' wails.json)

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "$TAG" != "v$PRODUCT_VERSION" ]]; then
              echo "ERROR: stable tag $TAG does not match productVersion v$PRODUCT_VERSION"
              exit 1
            fi
            echo "OK: stable tag $TAG matches productVersion"
          elif [[ "$TAG" =~ ^v0\.0\.0-rehearsal\.[0-9]+$ ]]; then
            echo "OK: rehearsal tag $TAG"
          else
            echo "ERROR: unsupported tag format: $TAG"
            exit 1
          fi

  licenses-check:
    name: License Consistency Check
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Download Go modules
        run: GOTOOLCHAIN=go1.26.4 go mod download all

      - name: Generate licenses
        run: make licenses

      - name: Verify no license drift
        run: git diff --exit-code THIRD_PARTY_LICENSES.md

  build:
    name: Build ${{ matrix.platform }}
    needs: licenses-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: darwin-amd64
            arch: x86_64
          - os: macos-14
            platform: darwin-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev gcc

      - name: Install nfpm (Linux packaging)
        if: matrix.platform == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'darwin')
        run: |
          brew install sqlcipher create-dmg

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn mingw-w64-x86_64-gcc-libs
          choco install nsis -y

      - name: Force static libdl (avoid libdl.dll runtime dependency)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          ls -la /c/msys64/mingw64/lib/libdl* || true
          rm -f /c/msys64/mingw64/lib/libdl.dll.a /c/msys64/mingw64/bin/libdl.dll
          test -f /c/msys64/mingw64/lib/libdl.a && echo "static libdl.a present"

      - name: Build and Package
        run: ./scripts/build/wails-build.sh ${{ matrix.platform }} ${{ github.ref_name }}
        shell: bash

      - name: Check binary size
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Verify release artifact
        run: ./scripts/build/verify-release-artifact.sh ${{ matrix.platform }} ${{ matrix.arch }}
        shell: bash

      - name: Linux runtime smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export HOME="$RUNNER_TEMP/medmemo-home"
          export MEDMEMO_DATA_DIR="$RUNNER_TEMP/medmemo-data"
          mkdir -p "$HOME" "$MEDMEMO_DATA_DIR"

          xvfb-run -a timeout 20s ./build/bin/MedMemo &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "ERROR: MedMemo binary crashed or exited early"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Smoke test passed: binary stays alive for 5s"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medmemo-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/bin/*
          retention-days: 1

  release:
    name: Create GitHub Draft Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      checksums_sha256: ${{ steps.checksums.outputs.checksums_sha256 }}
      tree_sha: ${{ steps.tree.outputs.tree_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-linux-${{ github.ref_name }}
          path: artifacts/linux/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-windows-${{ github.ref_name }}
          path: artifacts/windows/

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-amd64-${{ github.ref_name }}
          path: artifacts/darwin-amd64/

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-arm64-${{ github.ref_name }}
          path: artifacts/darwin-arm64/

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          ./scripts/build/prepare-release-assets.sh "$VERSION" "release-assets" \
            "artifacts/linux" "artifacts/windows" \
            "artifacts/darwin-amd64" "artifacts/darwin-arm64"
          echo "Staged release assets:"
          ls -la release-assets/

      - name: Compute tree SHA
        id: tree
        run: |
          set -euo pipefail
          TREE_SHA=$(git rev-parse "${{ github.ref }}^{tree}")
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
          echo "Tree SHA: $TREE_SHA"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: linux

      - name: Collect GoReleaser checksums
        run: |
          set -euo pipefail
          if [ ! -f dist/checksums.txt ]; then
            echo "ERROR: GoReleaser did not generate dist/checksums.txt"
            exit 1
          fi
          cp dist/checksums.txt release-assets/checksums.txt
          echo "checksums.txt copied to release-assets/"
          cat release-assets/checksums.txt

      - name: Verify release asset whitelist
        run: |
          set -euo pipefail
          ./scripts/build/verify-release-assets.sh release-assets "${{ github.ref_name }}"

      - name: Compute checksums file SHA256
        id: checksums
        run: |
          set -euo pipefail
          CHECKSUMS_SHA256=$(sha256sum release-assets/checksums.txt | awk '{print $1}')
          echo "checksums_sha256=$CHECKSUMS_SHA256" >> "$GITHUB_OUTPUT"
          echo "Checksums SHA256: $CHECKSUMS_SHA256"

      - name: Set rehearsal prerelease
        if: startsWith(github.ref_name, 'v0.0.0-rehearsal.')
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" --prerelease=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render initial Draft body
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          RUN_ID="${{ github.run_id }}"
          TREE_SHA="${{ steps.tree.outputs.tree_sha }}"
          CHECKSUMS_SHA256="${{ steps.checksums.outputs.checksums_sha256 }}"

          cat > release-body.md <<EOF
          ## MedMemo $TAG Draft

          This is a **Draft** release. It is not yet public and must not be distributed.

          Rehearsal-Run-ID: $RUN_ID
          Rehearsal-Tree: $TREE_SHA
          Checksums-File-SHA256: $CHECKSUMS_SHA256

          Platform evidence runs will be recorded before publication.
          EOF

          gh release edit "$TAG" --notes-file release-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release database ID
        id: create_release
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release database ID: $RELEASE_ID"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
