name: Release

on:
  push:
    tags:
      # 仅处理正式版本 tag；预发布 rc tag（vX.Y.Z-rc.N）完全由 build-and-release.yml
      # 负责创建，避免同一 tag 被两个工作流重复创建 Release、且 draft 状态不一致。
      - 'v*'
      - '!v*-rc*'
      - '!v*-Pre-release*'

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: darwin-amd64
            arch: x86_64
          - os: macos-14
            platform: darwin-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libwebkit2gtk-4.1-dev gcc

      - name: Install nfpm (Linux packaging)
        if: matrix.platform == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'darwin')
        run: |
          brew install sqlcipher create-dmg

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn mingw-w64-x86_64-gcc-libs
          choco install nsis -y

      - name: Build and Package
        run: ./scripts/build/wails-build.sh ${{ matrix.platform }} ${{ github.ref_name }}
        shell: bash

      - name: Check binary size
        if: matrix.platform == 'linux'
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"
        shell: bash

      - name: Verify release artifact
        run: ./scripts/build/verify-release-artifact.sh ${{ matrix.platform }} ${{ matrix.arch }}
        shell: bash

      - name: Linux runtime smoke test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          export HOME="$RUNNER_TEMP/medmemo-home"
          export MEDMEMO_DATA_DIR="$RUNNER_TEMP/medmemo-data"
          mkdir -p "$HOME" "$MEDMEMO_DATA_DIR"

          # Start the binary in the background and ensure it stays alive for 5s.
          xvfb-run -a timeout 20s ./build/bin/MedMemo &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "ERROR: MedMemo binary crashed or exited early"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Smoke test passed: binary stays alive for 5s"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medmemo-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/bin/*
          retention-days: 1

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-linux-${{ github.ref_name }}
          path: build/bin/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-windows-${{ github.ref_name }}
          path: build/bin/

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-amd64-${{ github.ref_name }}
          path: build/bin/

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: medmemo-darwin-arm64-${{ github.ref_name }}
          path: build/bin/

      - name: List release assets
        run: ls -la build/bin/

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: linux
