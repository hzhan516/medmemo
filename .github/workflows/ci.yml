name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Frontend lint
        run: cd web && npm run lint

      - name: Frontend typecheck
        run: cd web && npx tsc --noEmit

      - name: Validate provider templates JSON
        run: node scripts/validate-provider-templates.js

      - name: Build frontend
        run: cd web && npm run build

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=10m ./...

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Download native libraries for unit tests
        run: |
          ./scripts/build/download-onnx.sh --platform=linux
          ./scripts/build/download-tokenizers.sh --platform=linux

      - name: Run unit tests
        run: make test

      - name: Download coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage.out
          retention-days: 7

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Download native libraries for integration tests
        run: |
          ./scripts/build/download-onnx.sh --platform=linux
          ./scripts/build/download-tokenizers.sh --platform=linux

      - name: Run integration tests
        run: make test-integration

  e2e-test:
    name: E2E Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Run E2E tests
        run: go test -tags=e2e ./e2e/go/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install Wails Linux dependencies
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Frontend build check
        run: cd web && npm run build

      - name: Download ONNX Runtime and Tokenizers (Linux)
        run: |
          ./scripts/build/download-onnx.sh --platform=linux
          ./scripts/build/download-tokenizers.sh --platform=linux

      - name: Build Linux binary
        run: wails build -platform linux/amd64 -tags webkit2_41,ORT

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s build/bin/MedMemo)
          MAX=157286400  # 150MB in bytes
          if [ $SIZE -gt $MAX ]; then
            echo "Binary size $SIZE exceeds limit $MAX"
            exit 1
          fi
          echo "Binary size OK: $SIZE bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: medmemo-linux-build
          path: build/bin/
          retention-days: 30

  cross-platform-build:
    name: Cross Platform Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install SQLCipher (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install SQLCipher (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlcipher

      - name: Download ONNX Runtime and Tokenizers (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/build/download-onnx.sh --platform=linux
          ./scripts/build/download-tokenizers.sh --platform=linux

      - name: Download ONNX Runtime and Tokenizers (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/build/download-onnx.sh --platform=darwin
          ./scripts/build/download-tokenizers.sh --platform=darwin

      - name: Build frontend
        if: runner.os != 'Windows'
        run: cd web && npm run build

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -tags webkit2_41,ORT

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build -clean -tags ORT

      - name: Download ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\build\download-onnx.ps1 -Platform windows

      - name: Download Tokenizers (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\build\download-tokenizers.ps1

      - name: Install dlfcn-win32 for ortgenai (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-dlfcn

      - name: Prepare ntdll import lib for tokenizers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # MinGW-w64 官方 libntdll.a 不包含 Native API 符号（NtReadFile 等）。
          # 必须从系统 ntdll.dll 现场生成一个完整的导入库。
          echo "Generating libntdll.a from C:/Windows/System32/ntdll.dll..."
          objdump -p /c/Windows/System32/ntdll.dll | \
            awk '/Ordinal.*Hint.*Name/{start=1; next} start && /^[[:space:]]*$/ {exit} start {last=$NF; if(last ~ /[a-zA-Z]/) print last}' \
            > /tmp/ntdll_exports.txt

          echo "LIBRARY ntdll.dll" > /tmp/ntdll.def
          echo "EXPORTS" >> /tmp/ntdll.def
          cat /tmp/ntdll_exports.txt >> /tmp/ntdll.def

          dlltool -D ntdll.dll -d /tmp/ntdll.def -l resources/lib/windows/libntdll.a
          echo "Generated libntdll.a with $(wc -l < /tmp/ntdll_exports.txt) exports"

      - name: Build frontend
        if: runner.os == 'Windows'
        run: cd web && npm run build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: wails build -clean -tags ORT
        env:
          CGO_CFLAGS: "-IC:/msys64/mingw64/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/resources/lib/windows -LC:/msys64/mingw64/lib -ldl"
